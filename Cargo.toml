[package]
name = "openconstruct"
version = "0.1.0"
edition = "2021"
description = "Native Rust client for OpenConstruct — onboarding, module registry, policy engine, in-process fleet discovery, and sense shadows"
license = "MIT"
repository = "https://github.com/SuperInstance/openconstruct-rust"
keywords = ["openconstruct", "sdk", "agent", "onboarding"]
categories = ["development-tools"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
thiserror = "1"

[dev-dependencies]
