[package]
name = "openconstruct"
version = "0.1.0"
edition = "2021"
description = "Native Rust SDK for OpenConstruct — full-featured client for onboarding, modules, policy, fleet, and sense"
license = "MIT"
repository = "https://github.com/SuperInstance/openconstruct-rust"
keywords = ["openconstruct", "sdk", "agent", "onboarding"]
categories = ["api-bindings", "development-tools"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
thiserror = "1"

[dev-dependencies]
